
name: Rodando Testes de Regressão com Push

on: push
  branches:
    - main

jobs:
  playwright-run:
    runs-on: ubuntu-latest

    steps:
      - name: Baixando projeto
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalando dependências
        run: npm ci

      - name: Instalando navegadores do Playwright
        run: npx playwright install --with-deps

      - name: Rodar Testes de Regressão
        run: npx playwright test

      - name: Upload screenshots e evidências
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

      - name: Upload relatório Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
